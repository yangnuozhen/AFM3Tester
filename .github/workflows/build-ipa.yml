name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Archive and package IPA
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Xcode version
        run: |
          set -euo pipefail

          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2; exit }')"
          echo "Using Xcode $xcode_version"
          [[ "$xcode_version" == 27.* ]]

      - name: Archive app
        run: |
          set -euo pipefail

          xcodebuild \
            -project AFM3Tester.xcodeproj \
            -scheme AFM3Tester \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AFM3Tester.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          app_path="$RUNNER_TEMP/AFM3Tester.xcarchive/Products/Applications/AFM3Tester.app"
          payload_path="$RUNNER_TEMP/Payload"

          test -d "$app_path"
          rm -rf "$payload_path"
          mkdir -p "$payload_path"
          cp -R "$app_path" "$payload_path/AFM3Tester.app"

          ditto -c -k --sequesterRsrc --keepParent \
            "$payload_path" "$RUNNER_TEMP/AFM3Tester-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AFM3Tester-ipa-${{ github.sha }}
          path: ${{ runner.temp }}/AFM3Tester-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
